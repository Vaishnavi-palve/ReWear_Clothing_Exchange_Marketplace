<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Clothing — ReWear</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">♻ ReWear</a><nav><a class="active" href="listings.html">Browse</a><a href="dashboard.html">Dashboard</a><a href="chat.html">Chat</a><a href="admin.html">Admin</a></nav><div class="nav-actions"><span id="navUser"></span><a class="btn btn-outline" href="login.html" id="loginBtn">Login</a></div></header>
